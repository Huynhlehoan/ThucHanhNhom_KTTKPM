spring.application.name=BookingService
server.port=8083
spring.datasource.url=jdbc:mariadb://localhost:3306/booking_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# --- KAFKA CHU?N ---
# Thay localhost b?ng IP máy n?u ch?y Docker (ví d? 172.27.98.64)
spring.kafka.bootstrap-servers=192.168.137.95:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=booking-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# THÊM DÒNG NÀY: ?? tránh l?i mapping class khi nh?n event t? service khác
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map