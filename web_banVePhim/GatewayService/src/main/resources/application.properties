spring.config.import=optional:file:.env[.properties]
spring.application.name=gateway-service
server.port=${GATEWAY_PORT}

# --- CẤU HÌNH ROUTING ĐẾN MICROSERVICES ---
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://${IP_MAY2}:${USER_SERVICE_PORT}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=movie-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://${IP_MAY2}:${MOVIE_SERVICE_PORT}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/movies/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://${IP_MAY2}:${BOOKING_SERVICE_PORT}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://${IP_MAY3}:${PAYMENT_SERVICE_PORT}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

# --- CẤU HÌNH CORS ---
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origins=http://${IP_MAY1}:3000,http://localhost:3000,http://127.0.0.1:3000
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allow-credentials=true
