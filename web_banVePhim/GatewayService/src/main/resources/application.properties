spring.application.name=GatewayService
server.port=8080
spring.main.allow-bean-definition-overriding=true

# --- C?U HÌNH ROUTING (Dùng prefix webmvc chu?n 2026) ---
# 1. User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# 2. Movie Service
spring.cloud.gateway.server.webmvc.routes[1].id=movie-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/movies/**

# 3. Booking Service
spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**

# --- C?U HÌNH CORS (Ph?i ?i cùng b? server.webmvc) ---
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webmvc.